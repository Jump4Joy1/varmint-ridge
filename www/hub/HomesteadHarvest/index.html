<script id="themeTheme">/* theme: prefers-color-scheme, or a Settings choice saved in localStorage */
(function(){var K='harvest.theme',mq=matchMedia('(prefers-color-scheme: dark)');
function get(){try{return localStorage.getItem(K)||'auto'}catch(e){return 'auto'}}
function apply(){var v=get(),t=v==='auto'?(mq.matches?'dark':'light'):v;document.documentElement.setAttribute('data-theme',t);
document.querySelectorAll('[data-theme-choice]').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-theme-choice')===v?'true':'false')})}
function set(mode){try{localStorage.setItem(K,mode)}catch(e){}apply()}
window.HarvestTheme={get:get,set:set,apply:apply};
apply();mq.addEventListener('change',apply)})();
</script>

<script>
var hhT = HarvestStrings.t;
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
let score=0, level=1, high=parseInt(localStorage.getItem('harvestHigh')||'0');
let running=false, paused=false, muted=localStorage.getItem('harvestMute')==='1', gameOver=false;
let crops=[], seasonTime=0;
const cropTypes=['Tomato','Pepper','Corn','Pumpkin','Carrot','Strawberry'];
function init(){
 crops=[];
 for(let i=0;i<9;i++){
  crops.push({
   x:30+i*60,
   y:280,
   growth:0,
   type:cropTypes[Math.floor(Math.random()*cropTypes.length)],
   ready:false,
   maxGrowth:1
  });
 }
 score=0; level=1; seasonTime=0; running=true; paused=false; gameOver=false;
}
function drawCrop(c){
 const g=Math.min(1,c.growth);
 const h=g*100;
 ctx.fillStyle=g>0.85?'#305032':(g>0.4?'#C19A50':'#8B7355');
 ctx.fillRect(c.x, c.y-h, 45, h);
 ctx.fillStyle='#C19A50';
 ctx.font='11px Arial';
 ctx.fillText(c.type, c.x, c.y+15);
 if(c.ready){
  ctx.fillStyle='#FFD700';
  ctx.fillText('READY', c.x, c.y-h-8);
 }
}
function draw(){
 ctx.fillStyle='#0F0F0F';
 ctx.fillRect(0,0,canvas.width,canvas.height);
 crops.forEach(drawCrop);
 ctx.fillStyle='#C19A50';
 ctx.font='16px Georgia, "Iowan Old Style", Palatino, "Palatino Linotype", serif';
 ctx.fillText(`Score: ${score}  Level: ${level}`, 10, 30);
 if(paused){
  ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#C19A50';
  ctx.font='28px Georgia, "Iowan Old Style", Palatino, "Palatino Linotype", serif';
  ctx.fillText('PAUSED', 140, 250);
 }
}
function update(){
 if(!running||paused||gameOver){ draw(); requestAnimationFrame(update); return; }
 seasonTime+=0.016;
 crops.forEach(c=>{
  c.growth += 0.003 * level;
  if(c.growth >= 1 && !c.ready) c.ready=true;
  if(c.growth > 1.4){
   c.growth=0; c.ready=false; score=Math.max(0,score-10); playSound(100,0.2);
  }
 });
 if(seasonTime > 40){
  level++;
  seasonTime=0;
  playSound(500,0.15);
  if(level>10){ gameOver=true; document.getElementById('finalScore').textContent=score; document.getElementById('over').style.display='flex'; canvas.style.display='none'; }
 }
 draw();
 requestAnimationFrame(update);
}
function startGame(){
 document.getElementById('title').style.display='none';
 document.getElementById('over').style.display='none';
 document.getElementById('scores').style.display='none';
 canvas.style.display='block';
 init();
 requestAnimationFrame(update);
 playSound(440,0.1);
 scaleCanvas();
}
function togglePause(){
 if(!running||gameOver) return;
 paused=!paused;
 document.getElementById('pause').style.display=paused?'flex':'none';
}
function showHow(){}
function showScores(){
 document.getElementById('title').style.display='none';
 document.getElementById('scores').style.display='flex';
 const list=JSON.parse(localStorage.getItem('harvestTop')||'[]');
 document.getElementById('scorelist').innerHTML=list.length?list.map((s,i)=>`<div>${i+1}. ${s.initials} - ${s.score}</div>`).join(''):'<div>'+hhT('noScores')+'</div>';
}
function saveScore(){
 const initials=(document.getElementById('initials').value||'AAA').toUpperCase().slice(0,3);
 let list=JSON.parse(localStorage.getItem('harvestTop')||'[]');
 list.push({initials,score});
 list.sort((a,b)=>b.score-a.score);
 localStorage.setItem('harvestTop',JSON.stringify(list.slice(0,5)));
 if(score>high) localStorage.setItem('harvestHigh',score);
 showScores();
}
function showTitle(){
 document.getElementById('title').style.display='flex';
 document.getElementById('scores').style.display='none';
 canvas.style.display='none';
 running=false;
}
function scaleCanvas(){
 const maxW=window.innerWidth-20, maxH=window.innerHeight-60;
 const scale=Math.min(maxW/400, maxH/500, 1);
 canvas.style.transform=`scale(${scale})`;
 canvas.style.transformOrigin='center';
}
canvas.addEventListener('click', e=>{
 if(typeof hhPointer==='function'){ hhPointer(e.clientX, e.clientY); return; }
});
canvas.addEventListener('touchstart', e=>{
 e.preventDefault();
 if(typeof hhPointer==='function' && e.touches[0]) hhPointer(e.touches[0].clientX, e.touches[0].clientY);
}, {passive:false});
document.addEventListener('keydown', e=>{
 if(e.key==='p'||e.key==='P'||e.key==='Escape') togglePause();
 if(e.key==='m'||e.key==='M'){ muted=!muted; localStorage.setItem('harvestMute',muted?'1':'0'); }
});
window.addEventListener('resize', scaleCanvas);
let audioCtx;
function playSound(freq,dur){
 if(muted) return;
 if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 const o=audioCtx.createOscillator(), g=audioCtx.createGain();
 o.frequency.setValueAtTime(freq, audioCtx.currentTime);
 g.gain.setValueAtTime(0.08, audioCtx.currentTime);
 g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
 o.connect(g); g.connect(audioCtx.destination);
 o.start(); o.stop(audioCtx.currentTime+dur);
}
</script>

  [261.63, 0.5], [329.63, 0.5], [293.66, 1], [220.00, 1],

  [164.81, 1], [146.83, 0.5], [130.81, 0.5], [196.00, 1],
  [220.00, 1], [174.61, 1], [146.83, 1], [110.00, 1]
];
var hh = {
  phase: 'title',
  levels: { water: 0, basket: 0, compost: 0 },
  coins: 20,
  spoiled: 0,
  water: 0,
  fx: [],
  wasReady: [false, false, false, false, false, false, false, false, false],
  cssW: 400,
  cssH: 500,
  dpr: 1,
  banner: '',
  bannerT: 0,
  looping: false,
  pending: null,
  banjoNext: 0,
  banjoStep: 0,
  last: 0,
  walk: 0,
  bees: [],
  len: 32,
  between: false
};
var hhBee;
for (hhBee = 0; hhBee < 12; hhBee++) {
  hh.bees.push({ x: 20 + hhBee * 30, y: 70 + (hhBee % 4) * 28, a: hhBee * 0.6, s: 14 + (hhBee % 3) * 6 });
}
var hhStyle = document.createElement('style');
hhStyle.textContent = ''
  + '#hhShop{z-index:16;overflow:auto;padding:16px 8px;}'
  + '#hhShop button{min-width:180px;}'
  + '#title,#pause,#over,#scores,#hhSettings{overflow:auto;}'
  + 'canvas{touch-action:none;}'
  + 'body.is-play{justify-content:flex-start;align-items:stretch;}';
document.head.appendChild(hhStyle);

function hhInfo(c) { return HH_TYPES[c.type] || HH_TYPES.Tomato; }
function hhSeason() { return HH_SEASONS[Math.max(0, Math.min(9, level - 1))]; }
function hhSize() {
  return { w: hh.cssW || canvas.clientWidth || 400, h: hh.cssH || canvas.clientHeight || 500 };
}
function hhLayout() {
  var s = hhSize();
  var cols = 3;
  var rows = Math.max(1, Math.ceil((crops.length || 9) / cols));
  var sky = Math.max(108, Math.round(s.h * 0.2));
  var foot = 10;
  var hang = 30;
  var cellW = s.w / cols;
  var cellH = (s.h - sky - foot) / rows;
  var gap = Math.max(18, Math.round(cellH * 0.14));
  var i, c, col, row;
  for (i = 0; i < crops.length; i++) {
    c = crops[i];
    col = i % cols;
    row = Math.floor(i / cols);

  }
}
function hhPointer(clientX, clientY) {
  var rect, s, x, y, i, c, rx;
  if (!running || paused || gameOver || hh.phase !== 'grow') return;
  rect = canvas.getBoundingClientRect();
  s = hhSize();
  if (!rect.width || !s.w || !s.h) return;
  x = (clientX - rect.left) * (s.w / rect.width);
  y = (clientY - rect.top) * (s.h / rect.height);
  for (i = crops.length - 1; i >= 0; i--) {
    c = crops[i];
    rx = c.bedRx || 50;
    if (Math.abs(x - (c.x + 44)) <= rx + 6 && y <= c.y + rx * 0.55 && y >= c.y - (c.maxH || 110) - 30) {
      hhPick(i);
      return;
    }
  }
}
drawCrop = function (c) { hhDrawPlant(c); };
draw = function () { hhPaint(); };
scaleCanvas = function () {
  var tools = 76;
  var hudSpace = 74;
  var maxW = Math.max(180, window.innerWidth);
  var maxH = Math.max(220, window.innerHeight - tools - hudSpace);
  var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  hh.cssW = maxW;
  hh.cssH = maxH;
  hh.dpr = dpr;
  canvas.style.transform = 'none';
  canvas.style.border = '0';
  canvas.style.maxWidth = 'none';
  canvas.style.maxHeight = 'none';
  canvas.style.width = maxW + 'px';
  canvas.style.height = maxH + 'px';
  canvas.width = Math.round(maxW * dpr);
  canvas.height = Math.round(maxH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  if (crops && crops.length) hhLayout();
};
startGame = function () {
  var pending = hh.pending;
  var openShop = false;
  var settings = document.getElementById('hhSettings');
  var help = document.getElementById('hhHelp');
  hh.pending = null;
  document.getElementById('title').style.display = 'none';
  document.getElementById('over').style.display = 'none';
  document.getElementById('scores').style.display = 'none';
  document.getElementById('pause').style.display = 'none';
  if (settings) settings.style.display = 'none';
  if (help) help.style.display = 'none';
  hhHideShop();
  document.body.classList.add('is-play');
  var hud = document.getElementById('hhHud');
  if (hud) hud.hidden = false;
  canvas.style.display = 'block';
  init();
  hhFresh();
  scaleCanvas();
  if (pending) {
    hhApply(pending);
    hhLayout();
    openShop = hh.phase === 'shop';
  } else {
    localStorage.removeItem('harvestSave');
    hhBanner();
  }
  hhEnsure();
  if (openShop) {
    paused = true;
    hhShowShop();
  }
  playSound(440, 0.1);
  if (!hh.looping) {
    hh.looping = true;
    requestAnimationFrame(update);
  }
};
update = function () {
  var now = performance.now();
  var dt = hh.last ? Math.min(0.05, (now - hh.last) / 1000) : 0.016;
  hh.last = now;
  if (!dt || dt < 0) dt = 0.016;
  try { hhServiceBanjo(); } catch (err) {}
  hhStep(dt);
  draw();
  requestAnimationFrame(update);
};
window.addEventListener('resize', function () { scaleCanvas(); });
document.addEventListener('keydown', function (e) {
  var n = parseInt(e.key, 10);
  if (n >= 1 && n <= crops.length) hhPick(n - 1);
});
document.getElementById('hhSettingsBtn').onclick = function () {
  document.getElementById('title').style.display = 'none';
  document.getElementById('scores').style.display = 'none';
  document.getElementById('hhHelp').style.display = 'none';
  document.getElementById('hhSettings').style.display = 'flex';
  if (window.HarvestTheme) HarvestTheme.apply();
};
document.getElementById('hhSettingsBack').onclick = function () {
  document.getElementById('hhSettings').style.display = 'none';
  if (!running) document.getElementById('title').style.display = 'flex';
};
document.querySelectorAll('[data-theme-choice]').forEach(function (b) {
  b.addEventListener('click', function () { HarvestTheme.set(b.getAttribute('data-theme-choice')); });
});
document.addEventListener('pointerdown', function (e) {
  var b = e.target.closest && e.target.closest('.icon-btn');
  if (b) b.classList.add('is-down');
});
function hhClearPress() {
  document.querySelectorAll('.icon-btn.is-down').forEach(function (b) { b.classList.remove('is-down'); });
}
document.addEventListener('pointerup', hhClearPress);
document.addEventListener('pointercancel', hhClearPress);
if (window.HarvestTheme) HarvestTheme.apply();
hhEnsure();
window.hhAfterLang = function () {
  hhRefreshShop();
  hhToggleMute(true);
  var scores = document.getElementById('scores');
  if (scores && scores.style.display === 'flex') showScores();
};
document.querySelectorAll('[data-lang-choice]').forEach(function (b) {
  b.addEventListener('click', function () { HarvestStrings.setLang(b.getAttribute('data-lang-choice')); });
});
HarvestStrings.apply();
</script>
