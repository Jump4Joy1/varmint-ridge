<script id="themeTheme">/* theme: prefers-color-scheme, or a Settings choice saved in localStorage */
(function(){var K='preservesafe.theme',mq=matchMedia('(prefers-color-scheme: dark)');
function get(){try{return localStorage.getItem(K)||'auto'}catch(e){return 'auto'}}
function apply(){var v=get(),t=v==='auto'?(mq.matches?'dark':'light'):v;document.documentElement.setAttribute('data-theme',t)}
function set(mode){try{localStorage.setItem(K,mode)}catch(e){}apply()}
window.PreserveTheme={get:get,set:set,apply:apply};
apply();mq.addEventListener('change',apply)})();
</script>

<style>
:root {
  --ink: #1A1A1A;
  --forest: #305032;
  --forest-deep: #1c3120;
  --gold: #C19A50;
  --gold-deep: #8d6d2e;
  --paper: #e4e2d2;
  --sheet: #f3f1e4;
  --clay: #d9c2a6;
  --clay-deep: #b08968;
  --line: rgba(26,26,26,.14);
  --danger: #1A1A1A;
  --ok: #305032;
  --shadow: 0 10px 30px rgba(26,26,26,.08);
  --radius: 16px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background:
    radial-gradient(1200px 500px at 10% -10%, rgba(193,154,80,.18), transparent 50%),
    repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(48,80,50,.045) 28px),
    var(--paper);
  color: var(--ink);
  font-family: Georgia, "Iowan Old Style", Palatino, "Palatino Linotype", serif;
  font-size: 17px;
  line-height: 1.45;
  min-height: 100vh;
}
button, input, select, textarea { font-family: inherit; font-size: 16px; color: var(--ink); }
button { cursor: pointer; }
#app { max-width: 980px; margin: 0 auto; padding: 18px 16px 108px; }
.mast {
  background: var(--forest-deep);
  color: var(--sheet);
  border-radius: 22px;
  padding: 18px 18px 14px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.mast:before {
  content: "";
  position: absolute; left: 0; right: 0; top: 0; height: 6px;
  background: linear-gradient(90deg, var(--gold), #e6d3a1, var(--gold));
}
a.hub-link { color: var(--gold); font-size: 15px; display: inline-block; margin-top: 10px; }
.kicker {
  letter-spacing: .22em;
  text-transform: uppercase;
  font-size: 11px;
  color: var(--gold);
  margin: 4px 0 6px;
}
.mast h1 { font-size: 34px; line-height: 1; margin: 0 0 6px; font-weight: 600; }
.mast p { margin: 0; max-width: 62ch; color: #efe7d4; }
.elev-chip {
  display: inline-flex; gap: 8px; align-items: center;
  margin-top: 12px; background: rgba(243,241,228,.1);
  border: 1px solid rgba(193,154,80,.7);
  border-radius: 999px; padding: 6px 12px; color: var(--sheet); font-size: 14px;
}
.nav {
  display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0;
}
.nav button, .chip, .btn, .btn-gold, .btn-quiet, .btn-ink {
  border-radius: 999px; border: 1px solid var(--forest);
  background: var(--sheet); color: var(--forest);
  padding: 10px 14px; min-height: 44px;
}
.nav button[aria-current="page"] { background: var(--forest); color: var(--sheet); }
.chip { padding: 8px 12px; min-height: 40px; }
.chip[aria-pressed="true"] { background: var(--gold); border-color: var(--gold-deep); color: var(--ink); }
.btn { background: var(--forest); color: var(--sheet); border-color: var(--forest); }
.btn-gold { background: var(--gold); border-color: var(--gold-deep); color: var(--ink); font-weight: 650; }
.btn-quiet { background: transparent; }
.btn-ink { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.stack { display: grid; gap: 12px; }
.card, .tip, .stop, .rulebox {
  background: var(--sheet);
  border-radius: var(--radius);
  padding: 14px 14px 12px;
  box-shadow: var(--shadow);
  border: 1px solid rgba(48,80,50,.12);
}
.card h2, .card h3 { margin: 0 0 6px; line-height: 1.2; }
.card h2 { font-size: 26px; }
.meta { color: var(--forest); font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }
.clay {
  background: linear-gradient(180deg, #ead7c2, var(--clay));
  border-radius: 12px; padding: 10px 12px; margin: 8px 0;
}
.tip { border-left: 5px solid var(--gold); }
.stop { background: var(--ink); color: var(--sheet); border-left: 5px solid var(--gold); }
.stop strong { color: var(--gold); }
.small { font-size: 14.5px; }
.source {
  font-size: 13.5px; color: #243326; background: #e7efe4;
  border-radius: 12px; padding: 8px 10px; margin-top: 8px;
}
label { display: block; font-size: 14px; margin-bottom: 4px; }
input[type="text"], input[type="number"], input[type="date"], input[type="search"], select, textarea {
  width: 100%; max-width: 100%;
  background: #fffdf6; border: 1px solid var(--clay-deep);
  border-radius: 12px; padding: 10px 12px; min-height: 44px;
}
textarea { min-height: 88px; }
.grid-2 { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 720px) {
  .grid-2 { grid-template-columns: 1fr 1fr; }
  .mast h1 { font-size: 44px; }
}
table { width: 100%; border-collapse: collapse; font-size: 15.5px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--forest); }
tr.due td { background: #f6e7c8; }
tr.over td { background: #1A1A1A; color: var(--sheet); }
.badge {
  display: inline-block; border-radius: 999px; padding: 2px 8px;
  background: var(--forest); color: var(--sheet); font-size: 12px; letter-spacing: .04em;
}
.badge.gold { background: var(--gold); color: var(--ink); }
.badge.warn { background: var(--ink); color: var(--gold); }
hr.rule { border: 0; border-top: 2px solid var(--gold); margin: 12px 0; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.check input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--forest); }
.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0;
  display: flex; justify-content: space-around; gap: 4px;
  background: var(--forest-deep); padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  z-index: 5;
}
.bottom-nav button {
  flex: 1; background: transparent; color: #efe7d4; border: 0;
  border-radius: 12px; min-height: 52px; font-size: 12px; letter-spacing: .04em;
}
.bottom-nav button[aria-current="page"] { background: var(--gold); color: var(--ink); }
#labels { display: none; }
.label-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.jar-label {
  border: 2px solid var(--ink); border-radius: 8px; padding: 8px;
  break-inside: avoid; background: white; color: black;
}
.jar-label b { font-size: 16px; }
@media print {
  body { background: white; }
  .bottom-nav, .mast, .nav, .noprint { display: none !important; }
  #app { max-width: none; padding: 0; }
  #labels { display: block; }
  .screen-only { display: none !important; }
}
.hidden { display: none !important; }
.count-dot {
  background: var(--gold); color: var(--ink); border-radius: 999px;
  padding: 0 6px; margin-left: 4px; font-size: 12px;
}
@media (min-width: 860px) {
  .bottom-nav { display: none; }
  #app { padding-bottom: 28px; }
}

/* light/dark */
html[data-theme=dark]{--ink:#ece6d4;--forest:#9cc79a;--forest-deep:#0f1c12;--gold:#d4b06a;--gold-deep:#b89248;--paper:#121712;--sheet:#1d251e;--clay:#4a3b2b;--clay-deep:#8a6c4e;--line:rgba(236,230,212,.16);--danger:#ece6d4;--ok:#9cc79a;--shadow:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}
html[data-theme=dark] .mast{color:#f3f1e4}html[data-theme=dark] .elev-chip{color:#f3f1e4}
html[data-theme=dark] .btn,html[data-theme=dark] .nav button[aria-current="page"]{color:#0f1c12}
html[data-theme=dark] .chip[aria-pressed="true"],html[data-theme=dark] .bottom-nav button[aria-current="page"]{color:#1A1A1A}
html[data-theme=dark] input[type="text"],html[data-theme=dark] input[type="number"],html[data-theme=dark] input[type="date"],html[data-theme=dark] input[type="search"],html[data-theme=dark] select,html[data-theme=dark] textarea{background:#151b16;color:#ece6d4}
html[data-theme=dark] .clay{background:linear-gradient(180deg,#3a2e22,#4a3b2b);color:#ece6d4}
html[data-theme=dark] .source{background:#1f2e22;color:#d6e6d3}
html[data-theme=dark] .stop{background:#0b0f0b;color:#f3f1e4}
html[data-theme=dark] tr.due td{background:#3d311b;color:#ece6d4}html[data-theme=dark] tr.over td{background:#000;color:#f3f1e4}
html[data-theme=dark] .card{border-color:rgba(236,230,212,.12)}
.stat-row{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.stat-chip{flex:1 1 72px;min-width:68px;background:#FFF8EA;color:#1A1A1A;border:2px solid #C19A50;box-shadow:inset 0 0 0 2px #305032;border-radius:12px;padding:4px 8px 6px}
.stat-chip span{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#305032;font-weight:700;line-height:1.15}
.stat-chip b{display:block;margin-top:2px;font-size:16px;line-height:1.1;color:#1A1A1A;font-variant-numeric:tabular-nums}
html[data-theme=dark] .stat-chip{background:#1A1A1A}
html[data-theme=dark] .stat-chip span,html[data-theme=dark] .stat-chip b{color:#F3E6C4}
.stat-chip.is-pop{animation:psPop .35s ease}
@keyframes psPop{40%{transform:scale(1.06)}}
.nav button.nav-ico,.bottom-nav button.nav-ico{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid #C19A50;border-radius:14px;background:#FFF8EA;color:#1A1A1A;box-shadow:inset 0 0 0 2px #305032;min-height:48px}
.nav button.nav-ico svg,.bottom-nav button.nav-ico svg{width:18px;height:18px;display:block}
.nav button.nav-ico[aria-current="page"]{background:#305032;color:#F3E6C4}
.bottom-nav button.nav-ico{flex-direction:column;gap:1px;min-height:56px;padding:4px 2px;background:#142016;color:#F3E6C4;font-size:10px;letter-spacing:.02em;box-shadow:inset 0 0 0 2px #1A1A1A}
.bottom-nav button.nav-ico[aria-current="page"]{background:#C19A50;color:#1A1A1A}
.ps-seal{position:fixed;z-index:40;width:14px;height:18px;border-radius:3px 3px 7px 7px;background:linear-gradient(#f3e6c4,#C19A50);border:2px solid #1A1A1A;pointer-events:none}
#psNotice{position:fixed;inset:0;z-index:60;background:rgba(26,26,26,.72);display:flex;align-items:center;justify-content:center;padding:16px}
#psNotice[hidden]{display:none !important}
#psNotice .sheet{background:#FFF8EA;color:#1A1A1A;border:3px solid #C19A50;border-radius:16px;padding:16px 18px;width:min(92vw,380px)}
#psNotice button{min-height:48px;border-radius:12px;border:3px solid #C19A50;background:#305032;color:#F3E6C4;padding:8px 16px}
@media (prefers-reduced-motion:reduce){.stat-chip.is-pop{animation:none}}
</style>

const ACID_PSI = {
  weighted(ft) {
    if (ft == null || ft < 0) return { ok: false, reason: psT("elevFirst") };
    if (ft <= 1000) return { ok: true, psi: 5, label: psBand("0–1,000 ft"), how: psT("useWeight", { n: 5 }) };
    return { ok: true, psi: 10, label: psBand("Above 1,000 ft"), how: psT("use10noMid") };
  },
  dial(ft) {
    if (ft == null || ft < 0) return { ok: false, reason: psT("elevFirst") };
    const rows = [[2000, 6, "0–2,000 ft"], [4000, 7, "2,001–4,000 ft"], [6000, 8, "4,001–6,000 ft"], [8000, 9, "6,001–8,000 ft"]];
    if (ft > 8000) return { ok: false, reason: psT("acidDialStop") };
    for (const [max, psi, label] of rows) if (ft <= max) return { ok: true, psi, label: psBand(label), how: psT("holdDial", { n: psi }) };
    return { ok: false, reason: psT("elevMissing") };
  }
};

function lowAcidWeighted(ft) {
  if (ft == null || ft < 0) return { ok: false, reason: psT("elevFirst") };
  if (ft <= 1000) return { ok: true, psi: 10, label: psBand("0–1,000 ft"), how: psT("useWeight", { n: 10 }) };
  return { ok: true, psi: 15, label: psBand("Above 1,000 ft"), how: psT("use15jump") };
}
function lowAcidDial(ft) {
  if (ft == null || ft < 0) return { ok: false, reason: psT("elevFirst") };
  const rows = [[2000, 11, "0–2,000 ft"], [4000, 12, "2,001–4,000 ft"], [6000, 13, "4,001–6,000 ft"], [8000, 14, "6,001–8,000 ft"]];
  if (ft > 8000) return { ok: false, reason: psT("lowDialStop") };
  for (const [max, psi, label] of rows) if (ft <= max) return { ok: true, psi, label: psBand(label), how: psT("holdDial", { n: psi }) };
  return { ok: false, reason: psT("elevMissing") };
}
function bandIndex(ft, bands) {
  for (let i = 0; i < bands.length; i++) {
    if (bands[i].maxFt == null || ft <= bands[i].maxFt) return i;
  }
  return bands.length - 1;
}
function boilAt(recipe, pack, jar, ft) {
  const row = recipe.packs && recipe.packs[pack] && recipe.packs[pack][jar];
  if (!row) return { ok: false, reason: psT("notInPack", { jar: psJar(jar), pack: PreserveStrings.lang() === "es" ? psPackWord(pack).toLowerCase() : pack.toLowerCase() }) };
  if (ft == null) return { ok: false, reason: psT("setElevColumn", { n: row[0] }) };
  const i = bandIndex(ft, recipe.bands);
  return { ok: true, minutes: row[i], label: recipe.bands[i].label, index: i };
}
function pressureFor(style, ft, gauge) {
  if (style === "weighted-15") {
    if (gauge === "dial") return { ok: false, reason: psT("dialNot10") };
    if (ft == null) return { ok: false, reason: psT("setElev") };
    return { ok: true, psi: 15, label: psBand(ft <= 1000 ? "0–1,000 ft" : "Above 1,000 ft"), how: psT("useWeight", { n: 15 }) };
  }
  if (style === "acid") return gauge === "dial" ? ACID_PSI.dial(ft) : ACID_PSI.weighted(ft);
  return gauge === "dial" ? lowAcidDial(ft) : lowAcidWeighted(ft);
}
function recipeById(id) { return RECIPES.find(r => r.id === id); }
function addMonths(iso, months) {
  if (!iso || months == null) return "";
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setMonth(dt.getMonth() + months);
  const mm = String(dt.getMonth() + 1).padStart(2, "0");
  const dd = String(dt.getDate()).padStart(2, "0");
  return dt.getFullYear() + "-" + mm + "-" + dd;
}
function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&" + "amp;")
    .replace(/</g, "&" + "lt;")
    .replace(/>/g, "&" + "gt;")
    .replace(/"/g, "&" + "quot;")
    .replace(/'/g, "&" + "#39;");
}
function uid() { return Math.random().toString(36).slice(2, 10); }

const STORE = "preserveSafe.v1";
let state;
function blankState() {
  return { ft: null, gauge: "weighted", batches: [], pantry: [], checks: {}, seq: 1, view: "recipes", q: "", filter: "all", recipeId: null, pack: null, jar: null, opt: 0, batchId: null, pantryId: null, checkFilter: "all" };
}
function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE) || "null");
    if (!raw || typeof raw !== "object") return blankState();
    const s = Object.assign(blankState(), raw);
    if (!Array.isArray(s.batches)) s.batches = [];
    if (!Array.isArray(s.pantry)) s.pantry = [];
    if (!s.checks || typeof s.checks !== "object") s.checks = {};
    return s;
  } catch (e) { return blankState(); }
}
function save() { localStorage.setItem(STORE, JSON.stringify(state)); }
function addDays(iso, days) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + days);
  const mm = String(dt.getMonth() + 1).padStart(2, "0");
  const dd = String(dt.getDate()).padStart(2, "0");
  return dt.getFullYear() + "-" + mm + "-" + dd;
}
function dueClass(iso) {
  if (!iso) return "";
  const t = todayISO();
  if (iso < t) return "over";
  const soon = addDays(t, 30);
  if (iso <= soon) return "due";
  return "";
}
function fifoItems() {
  return state.pantry.filter(p => !p.archived && p.jars > 0).slice().sort((a, b) => {
    if (!a.bestBy && !b.bestBy) return 0;
    if (!a.bestBy) return 1;
    if (!b.bestBy) return -1;
    return a.bestBy < b.bestBy ? -1 : a.bestBy > b.bestBy ? 1 : 0;
  });
}
function reminderCount() {
  const t = todayISO();
  const soon = addDays(t, 30);
  return fifoItems().filter(p => p.bestBy && p.bestBy <= soon).length;
}

  else if (act === "export") exportBackup();

    if (act === "pantry-from") state.recipeId = t.dataset.id;

function exportBackup() {

function importBackup(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(String(reader.result));
      if (!data || !Array.isArray(data.batches) || !Array.isArray(data.pantry)) throw new Error("bad");
      state = Object.assign(blankState(), data);
      state.batches = data.batches; state.pantry = data.pantry;
      save(); render();
    } catch (err) { showNotice(psT("badBackup")); }
  };
  reader.readAsText(file);
}

function selfCheck() {
  const errors = [];
  if (!PreserveStrings.keysEqual()) errors.push("lang keys");
  const eq = (a, b, m) => { if (a !== b) errors.push(m + " :: " + a + " !== " + b); };
  eq(boilAt(recipeById("peaches"), "Hot", "Quart", 1000).minutes, 25, "peach 1000");
  eq(boilAt(recipeById("peaches"), "Hot", "Quart", 1001).minutes, 30, "peach 1001");
  eq(boilAt(recipeById("peaches"), "Hot", "Quart", 3000).minutes, 30, "peach 3000");
  eq(boilAt(recipeById("peaches"), "Hot", "Quart", 3001).minutes, 35, "peach 3001");
  eq(boilAt(recipeById("peaches"), "Hot", "Quart", 6000).minutes, 35, "peach 6000");
  eq(boilAt(recipeById("peaches"), "Hot", "Quart", 6001).minutes, 40, "peach 6001");
  eq(lowAcidDial(1000).psi, 11, "dial 1000");
  eq(lowAcidDial(2000).psi, 11, "dial 2000");
  eq(lowAcidDial(2001).psi, 12, "dial 2001");
  eq(lowAcidDial(8000).psi, 14, "dial 8000");
  eq(lowAcidDial(8001).ok, false, "dial 8001");
  eq(lowAcidWeighted(1000).psi, 10, "wt 1000");
  eq(lowAcidWeighted(1001).psi, 15, "wt 1001");
  eq(addDays("2026-10-13", 30), "2026-11-12", "plus 30 days");
  const sample = esc("A<B>&");
  if (sample.indexOf("<") !== -1 || sample.indexOf(">") !== -1 || sample.indexOf("amp") === -1) errors.push("esc " + sample);
  RECIPES.forEach(r => { if (!r.source || r.source.length < 80) errors.push("thin source " + r.id); if (!r.name) errors.push("no name " + r.id); });
  eq(boilAt(recipeById("peaches"), "Hot", "Quart", 2500).minutes, 30, "peach 2500");
  eq(boilAt(recipeById("peaches"), "Hot", "Pint", 0).minutes, 20, "peach pint 0");
  eq(boilAt(recipeById("peaches"), "Raw", "Quart", 7000).minutes, 45, "peach raw quart high");
  eq(boilAt(recipeById("applesauce"), "Hot", "Pint", 500).minutes, 15, "sauce 500");
  eq(boilAt(recipeById("applesauce"), "Hot", "Pint", 2000).minutes, 20, "sauce 2000");
  eq(boilAt(recipeById("applesauce"), "Hot", "Pint", 4000).minutes, 20, "sauce 4000");
  eq(boilAt(recipeById("applesauce"), "Hot", "Pint", 7000).minutes, 25, "sauce 7000");
  eq(boilAt(recipeById("apple-juice"), "Hot", "Pint", 4000).minutes, 10, "juice 4000");
  eq(boilAt(recipeById("salsa-chile"), "Hot", "Pint", 340).minutes, 15, "salsa longview");
  eq(boilAt(recipeById("salsa-chile"), "Hot", "Pint", 2500).minutes, 20, "salsa 2500");
  eq(boilAt(recipeById("salsa-chile"), "Hot", "Pint", 7000).minutes, 25, "salsa 7000");
  eq(boilAt(recipeById("salsa-chile"), "Hot", "Quart", 0).ok, false, "salsa quart blocked by missing row");
  const bean = recipeById("snap-beans").jars.find(j => j.size === "Quart");
  eq(bean.minutes, 25, "bean minutes");
  eq(lowAcidDial(340).psi, 11, "dial 340");
  eq(lowAcidWeighted(340).psi, 10, "wt 340");
  eq(lowAcidDial(2500).psi, 12, "dial 2500");
  eq(lowAcidWeighted(2500).psi, 15, "wt 2500");
  eq(lowAcidDial(9000).ok, false, "dial 9000 blocked");
  eq(lowAcidWeighted(9000).psi, 15, "wt 9000");
  eq(ACID_PSI.dial(2500).psi, 7, "acid dial peach example");
  eq(ACID_PSI.weighted(0).psi, 5, "acid wt 0");
  eq(pressureFor("weighted-15", 2000, "dial").ok, false, "10-min tomato dial blocked");
  eq(pressureFor("weighted-15", 2000, "weighted").psi, 15, "10-min tomato weight");
  eq(addMonths("2026-10-13", 12), "2027-10-13", "plus 12 months");
  eq(recipeById("corn-cream").jars.length, 1, "cream corn pints only");
  eq(recipeById("tom-crushed").packs.Hot.Quart[0], 45, "crushed quart");
  eq(recipeById("tom-juice-pack").packs.Hot.Pint[0], 85, "juice pack");
  const ftState = [{ bestBy: "2027-01-01", jars: 1, archived: false }, { bestBy: "2026-11-01", jars: 2, archived: false }, { bestBy: "", jars: 1, archived: false }];
  const sorted = ftState.slice().sort((a, b) => !a.bestBy ? 1 : !b.bestBy ? -1 : (a.bestBy < b.bestBy ? -1 : 1));
  eq(sorted[0].bestBy, "2026-11-01", "fifo");
  return errors;
}

function psFly(fromEl, targetId) {
  const start = fromEl && fromEl.getBoundingClientRect ? fromEl.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight * 0.62, width: 0, height: 0 };
  const sx = start.left + start.width / 2;
  const sy = start.top + start.height / 2;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  requestAnimationFrame(() => {
    const chip = document.getElementById(targetId);
    let i, el, dest, dx, dy;
    if (!chip) return;
    chip.classList.remove("is-pop");
    void chip.offsetWidth;
    chip.classList.add("is-pop");
    if (reduce) return;
    dest = chip.getBoundingClientRect();
    dx = dest.left + dest.width / 2 - 7;
    dy = dest.top + dest.height / 2 - 9;
    for (i = 0; i < 5; i++) {
      el = document.createElement("div");
      el.className = "ps-seal";
      el.style.left = (sx + (i - 2) * 12) + "px";
      el.style.top = sy + "px";
      document.body.appendChild(el);
      el.animate([
        { transform: "translate(0px, 0px) scale(1)", opacity: 1 },
        { transform: "translate(" + ((dx - sx) * 0.45) + "px, " + ((dy - sy) * 0.3 - 36) + "px) scale(1.15)", opacity: 1, offset: 0.4 },
        { transform: "translate(" + (dx - sx) + "px, " + (dy - sy) + "px) scale(0.6)", opacity: 0.15 }
      ], { duration: 540, delay: i * 40, easing: "cubic-bezier(.2,.8,.2,1)", fill: "forwards" });
      setTimeout(() => { if (el.parentNode) el.remove(); }, 660 + i * 40);
    }
  });
}
function showNotice(msg) {
  let n = document.getElementById("psNotice");
  if (!n) {
    n = document.createElement("div");
    n.id = "psNotice";
    n.setAttribute("role", "alertdialog");
    document.body.appendChild(n);
  }
  n.hidden = false;
  n.innerHTML = '<div class="sheet"><p>' + esc(msg) + '</p><button type="button">' + esc(psT("ok")) + '</button></div>';
  n.querySelector("button").onclick = () => { n.hidden = true; };
}
function init() {
  state = load();
  const app = document.getElementById("app");
  if (!app) return;
  app.addEventListener("click", onClick);
  app.addEventListener("change", onChange);
  app.addEventListener("input", onInput);
  app.addEventListener("submit", onSubmit);
  render();
  const problems = selfCheck();
  if (problems.length) console.error(problems);
  if (location.search.indexOf("test=1") >= 0) {
    const box = document.createElement("pre");
    box.textContent = problems.length ? problems.join("\n") : "SELF CHECK OK " + RECIPES.length + " recipes";
    document.body.appendChild(box);
  }
}
if (typeof document !== "undefined") init();
