name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GITHUB_TOKEN cannot enable Pages. A token with Pages write can.
      # The connected GitHub app cannot call the Pages API, so this step
      # is best-effort and the deploy step is what publishes www/.
      - name: Enable Pages if the token is allowed
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the game
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
